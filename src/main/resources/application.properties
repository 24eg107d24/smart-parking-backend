
spring.application.name=backend

server.port=${PORT:8080}

# Database configuration:
# Uses MySQL if DB_URL is provided; otherwise seamlessly falls back to local embedded H2
spring.datasource.url=${DB_URL:jdbc:h2:file:./data/smartparking;DB_CLOSE_DELAY=-1}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

app.jwt.secret=${JWT_SECRET:SmartParkingSecretKeyForAuthentication123456789}
